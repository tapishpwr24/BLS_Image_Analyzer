<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLS Leaf Scorer</title>
<meta name="theme-color" content="#0e2318">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<!-- The study version is now the main app at /app/. Team links (#setup-…) are passed on. -->
<script>
  (function () {
    var target = "../app/" + location.search + location.hash;
    try {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { if (/\/study\/$/.test(r.scope)) r.unregister(); });
        }).catch(function () {}).then(function () { location.replace(target); });
        setTimeout(function () { location.replace(target); }, 1500);
      } else { location.replace(target); }
    } catch (e) { location.replace(target); }
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=../app/"></noscript>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e2318; color: #eef4ec; font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 16px; }
  a { color: #e3b53c; }
</style>
</head>
<body>
  <p>BLS Leaf Scorer has moved to its main address.<br><a href="../app/">Open the app</a></p>
</body>
</html>
